[package]
name = "liman"
version = "0.7.3"
description = "SSH, SFTP ve yerel terminal istemcisi"
authors = ["onuryrlmz"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "liman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
russh = "0.63.3"
russh-sftp = "3.0.0"
keyring = "4.2.0"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.26.1", features = ["v4"] }
anyhow = "1.0.104"
dirs = "7.0.0"
base64 = "0.23.1"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-clipboard-manager = "2.4.0"
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
tauri-plugin-updater = "2.13.0"
tauri-plugin-process = "2.4.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
serialport = { version = "4.10.1", default-features = false }
clipboard-rs = { version = "0.3.5", default-features = false, features = ["wayland"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDictionary", "NSError", "NSGeometry", "NSObject", "NSOperation", "NSString", "NSURL", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSFilePromiseProvider", "NSImage", "NSPasteboard", "NSResponder", "NSView", "NSWorkspace", "block2"] }
unicode-normalization = "0.1.26"
